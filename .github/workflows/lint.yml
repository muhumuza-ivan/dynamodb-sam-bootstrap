name: Lint templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint templates/*.yaml
      - run: bash -n scripts/*.sh
